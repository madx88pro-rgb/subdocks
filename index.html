<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Инструкция по подключению</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6; --green: #10b981; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border-radius: 14px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
    h1 { font-size: 1.35rem; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.45; margin-bottom: 14px; }
    .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.95rem; color: #fff; background: var(--accent); border: none; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-green { background: var(--green); }
    .btn-outline { background: transparent; border: 1px solid #334155; color: var(--text); }
    .pdf-box { width: 100%; height: 75vh; min-height: 450px; border: none; border-radius: 10px; background: #fff; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Инструкция по подключению</h1>
      <p>Скачайте PDF-руководство ниже или добавьте подписку в ваше приложение в один клик.</p>
      
      <!-- Блок быстрого импорта (появится, если передать ?sub=ССЫЛКА в URL) -->
      <div id="import-block" class="hidden" style="margin-bottom: 14px;">
        <div class="btn-grid">
          <a id="btn-happ" class="btn" href="#">📲 Импорт в Happ</a>
          <a id="btn-v2ray" class="btn" href="#">📲 Импорт в v2rayNG</a>
          <a id="btn-nekobox" class="btn" href="#">📲 Импорт в Nekobox</a>
          <button id="btn-copy" class="btn btn-outline" onclick="copySub()">📋 Скопировать ссылку</button>
        </div>
      </div>

      <div class="btn-grid">
        <a class="btn btn-green" href="./instruction.pdf" download="instruction.pdf">📥 Скачать PDF (310 КБ)</a>
        <a class="btn btn-outline" href="./instruction.pdf" target="_blank">🔍 Открыть PDF на весь экран</a>
      </div>
    </div>

    <div class="card" style="padding: 10px;">
      <iframe class="pdf-box" src="./instruction.pdf#view=FitH"></iframe>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const subUrl = params.get('sub');

    if (subUrl) {
      document.getElementById('import-block').classList.remove('hidden');
      const encoded = encodeURIComponent(subUrl);
      document.getElementById('btn-happ').href = `happ://add/${subUrl}`;
      document.getElementById('btn-v2ray').href = `v2rayng://install-sub?url=${encoded}&name=Subscription`;
      document.getElementById('btn-nekobox').href = `sn://subscription?url=${encoded}&name=Subscription`;
    }

    function copySub() {
      if (!subUrl) return;
      navigator.clipboard.writeText(subUrl).then(() => {
        const btn = document.getElementById('btn-copy');
        btn.textContent = '✅ Скопировано!';
        setTimeout(() => btn.textContent = '📋 Скопировать ссылку', 2000);
      });
    }
  </script>
</body>
</html>
